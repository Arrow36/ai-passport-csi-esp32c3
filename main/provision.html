<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSI Scope 配网</title>
<style>*{box-sizing:border-box}body{margin:0;background:#08111c;color:#e8f1f8;font:16px system-ui,sans-serif;min-height:100vh;padding:48px 24px}main{max-width:430px;margin:auto}small{color:#56dcc3;letter-spacing:3px}h1{font-size:34px;margin:14px 0}p{color:#a6b8c8;line-height:1.7}label{display:block;margin:24px 0 8px}input,button{width:100%;border-radius:12px;padding:14px;font:inherit}input{background:#142233;color:inherit;border:1px solid #30465c}button{margin-top:26px;background:#56dcc3;color:#062322;border:0;font-weight:700}button:disabled{opacity:.5}#result{white-space:pre-wrap}</style>
<main><small>FOLOTOY · CSI SCOPE</small><h1>连接你的路由器</h1><p>选择 2.4 GHz Wi-Fi。凭证只提交给这台设备，连接成功后保存在设备上。无需互联网。</p>
<form id="form"><label for="ssid">Wi-Fi 名称</label><input id="ssid" name="ssid" maxlength="32" autocomplete="off" required><label for="password">Wi-Fi 密码</label><input id="password" name="password" type="password" maxlength="64" autocomplete="off"><button id="submit">连接并开始采样</button></form><p id="result" role="status">连接成功后，设备会退出配网热点。将设备固定摆放，保持环境安静约 8 秒以完成校准。</p></main>
<script>const form=document.querySelector('#form'),result=document.querySelector('#result'),submit=document.querySelector('#submit');form.onsubmit=async e=>{e.preventDefault();const ssid=document.querySelector('#ssid').value,password=document.querySelector('#password').value;if(new TextEncoder().encode(ssid).length>32){result.textContent='Wi-Fi 名称不能超过 32 字节。';return}submit.disabled=true;try{const r=await fetch('/configure',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ssid,password})});const text=await r.text();if(!r.ok)throw Error(text);document.querySelector('#password').value='';result.textContent='已提交。请查看设备屏幕：连接成功后将自动开始采样。若屏幕提示连接失败，可在这里修改后重试。';}catch(error){result.textContent='未提交成功：'+error.message}finally{submit.disabled=false}};</script></html>
